[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseflow"
version = "0.1.0"
description = "PhaseFlow models for peptide and protein LLPS prediction."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "pyyaml>=6.0",
  "tqdm>=4.64.0",
  "scipy>=1.7.0",
  "einops>=0.6.0",
  "rotary-embedding-torch>=0.8.4",
  "torchdiffeq",
  "pot>=0.9.0",
  "matplotlib>=3.5.0",
]

[project.optional-dependencies]
protein = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "biopython>=1.81",
  "h5py>=3.10",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "einops>=0.7",
  "torchmetrics>=1.3",
]
test = ["pytest>=7.0"]
plm = [
  "transformers>=4.40",
  "huggingface_hub>=0.23",
  "accelerate>=0.30",
  "safetensors>=0.4",
]
starling = ["idptools-starling"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["phaseflow*"]
