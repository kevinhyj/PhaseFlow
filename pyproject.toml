[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseflow"
version = "0.1.0"
description = "Bidirectional generation of protein sequences and LLPS phase diagrams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "pyyaml>=6.0",
  "tqdm>=4.64.0",
  "scipy>=1.7.0",
  "einops>=0.6.0",
  "rotary-embedding-torch>=0.8.4",
  "torchdiffeq",
  "pot>=0.9.0",
  "matplotlib>=3.5.0",
]

[tool.setuptools.packages.find]
include = ["phaseflow*"]
