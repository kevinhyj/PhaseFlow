model:
  model_type: v2_region
  d_model: 256
  dropout: 0.1
  final_llps_alpha: 0.8
  ablation:
    name: no_starling_embed_train
    disabled_modalities:
    - starling_embed
    disabled_edge_types: []
    zero_disabled_bio_vec: true
  input_dims: *id001
  local_encoder:
    num_layers: 3
    kernels:
    - 3
    - 5
    - 9
    dilations:
    - 2
    - 4
  graph_transformer:
    num_layers: 4
    num_heads: 8
    ffn_dim: 1024
    edge_dim: 32
    num_edge_types: 40
    relative_position_bins: 32
    max_neighbors: 96
  region_mil_head:
    windows:
    - 33
    - 129
    - 257
    aggregation: topk_mean_plus_max
    topk_ratio: 0.04
    max_weight: 0.25
  region_decoder:
    num_queries: 24
    num_layers: 2
  bio_mlp:
    enabled: true
    input_dim: 33
    hidden:
    - 256
    - 256
    - 128
    dropout: 0.15
    norm: LayerNorm
    activation: GELU
    residual_scale: 1.0
  implementation:
    modality_adapter:
      per_modality: Linear(input_dim,256) -> LayerNorm -> GELU -> Dropout(0.10) ->
        Linear(256,256) -> LayerNorm
      modalities:
      - plm
      - physchem
      - disorder
      - protenix_embed
      - starling_embed
      modality_embedding: true
      source: ./phaseflow/models/adapters.py
    reliability_gate:
      type: ReliabilityGatedFusion
      gate: Linear(258,128) -> GELU -> Linear(128,1)
      normalization: softmax over available modalities after missing-modality masking
      uses_reliability_and_modality_mask: true
      source: ./phaseflow/models/fusion.py
    local_motif_block:
      per_layer_branches: Conv1d kernels 3/5/9 plus dilated Conv1d kernel 7 at dilations
        2/4
      projection: 1x1 Conv1d to 512 -> GLU -> Dropout(0.10) -> 1x1 Conv1d to 256
      residual_norm: residual add followed by LayerNorm
      source: ./phaseflow/models/local_motif_encoder.py
    protein_readout:
      attention_pool: learned Linear(256,1) residue attention
      masked_mean_pool: true
      local_evidence_pool: DPR/reference-logit attention pool
      pooled_representation_dim: 768
      mlp: Linear(768,256) -> GELU -> Dropout(0.10) -> Linear(256,1)
      source: ./phaseflow/models/heads.py
    bio_residual_readout:
      bio_mlp: LayerNorm(33) -> [Linear/GELU/Dropout(0.15)/LayerNorm] over 33->256->256->128
      fusion_head: LayerNorm(896) -> Linear(896,256) -> GELU -> Dropout(0.15) -> Linear(256,1)
      residual_scale: 1.0
      auxiliary_heads:
      - driver_head
      - client_head
      - negtype_head
      source: ./phaseflow/models/phaseflow.py
    local_region_evidence:
      head: MultiScaleDPRHead
      windows:
      - 33
      - 129
      - 257
      pooling: centered AvgPool1d with mask-normalized denominator
      window_parameters_shared: false
      aggregation: topk_mean_plus_max
      topk_ratio: 0.04
      max_weight: 0.25
      source: ./phaseflow/models/heads.py
    final_mixture:
      protein_probability_weight: 0.8
      region_probability_weight: 0.19999999999999996
      trained: false
      source: ./phaseflow/models/phaseflow.py
  freezing_by_module:
    modality_adapters: frozen
    reliability_gate: frozen
    local_encoder.layers.0: frozen
    local_encoder.layers.1: frozen
    local_encoder.layers.2: frozen
    graph_transformer.encoder.layers.0: frozen
