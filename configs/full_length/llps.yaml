# Full-length LLPS training configuration.
# Source data are published as a Hugging Face package; regenerated training
# tensors are stored separately under artifacts/derived/full_length.
seed: 20260612
device: auto
output_dir: runs/llps
auto_build_toy: false

feature_generation:
  enabled: false

data:
  dataset_class: PhaseFlowBatchPlanDataset
  dataset_root: artifacts/derived/full_length/llps/processed
  input_contract: artifacts/derived/full_length/llps/processed/configs/offline_input_contract.yaml
  sample_index: artifacts/derived/full_length/llps/training/sample_index.parquet
  graph_source: merged_sparse
  allow_legacy_h5: false
  build_embeddings_at_runtime: false
  build_graph_at_runtime: false
  merge_edges_at_runtime: false
  train_region_supervision: none
  valid_region_supervision: none

dataset:
  type: PhaseFlowBatchPlanDataset
  plan_dir: artifacts/derived/full_length/llps/training/plan
  sample_index: artifacts/derived/full_length/llps/training/sample_index.parquet
  dataset_root: artifacts/derived/full_length/llps/processed
  input_contract: artifacts/derived/full_length/llps/processed/configs/offline_input_contract.yaml
  esm2_store_metadata: artifacts/derived/full_length/llps/training/esm2_store_metadata_by_sequence.parquet
  npz_mirror_manifest: artifacts/derived/full_length/llps/processed/features/npz_mirror_manifest.parquet
  region_supervision: none
  edge_attr_dim: 32
  hot_cache_pools: [P1_driver, P2_client, P3_C_D, N2_ND]
  hot_cache_max_samples: 768

model:
  model_type: v2_region
  d_model: 256
  dropout: 0.1
  llps_region_mix: 0.8
  ablation:
    name: no_starling_embedding
    disabled_modalities: [starling_embed]
    disabled_edge_types: []
    zero_disabled_bio_vec: true
  input_dims:
    plm: 1280
    physchem: 90
    disorder: 6
    protenix_embed: 512
    starling_embed: 512
  local_encoder:
    num_layers: 3
    kernels: [3, 5, 9]
    dilations: [2, 4]
  graph_transformer:
    num_layers: 4
    num_heads: 8
    ffn_dim: 1024
    edge_dim: 32
    num_edge_types: 40
    relative_position_bins: 32
    max_neighbors: 96
  region_mil_head:
    windows: [33, 129, 257]
    aggregation: topk_mean_plus_max
    topk_ratio: 0.04
    max_weight: 0.25
  region_decoder:
    num_queries: 24
    num_layers: 2
  bio_mlp:
    enabled: true
    input_dim: 33
    hidden: [256, 256, 128]
    dropout: 0.15
    norm: LayerNorm
    activation: GELU
    residual_scale: 1.0

training:
  distributed_backend: ddp
  nproc_per_node: 8
  multi_gpu: true
  ddp_find_unused_parameters: true
  batch_size: 4
  optimizer_batch_size: 4
  max_epochs: 3
  max_steps: 700
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 2
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true
  amp: false
  precision: fp32
  max_neighbors: 96
  require_precomputed_graph: false
  build_embeddings_at_runtime: false
  build_graph_at_runtime: false
  merge_edges_at_runtime: false
  checkpoint_reload_check: true
  resume_training_state: true
  strict_resume: false
  full_train_no_internal_validation: true
  use_internal_validation: false
  freeze:
    enabled: true
    freeze_all_except_trainable_prefixes: true
    trainable_prefixes: [llps_head, bio_mlp, bio_fusion_head, driver_head, client_head, negtype_head, encoder.layers.2, encoder.layers.3]
  ema:
    enabled: true
    decay: 0.995
    update_after_steps: 50
    use_for_eval: true
    save_ema: true
  parameter_groups:
    - name: llps_head
      prefixes: [llps_head, bio_fusion_head, driver_head, client_head, negtype_head]
      lr: 0.0001
    - name: bio_mlp
      prefixes: [bio_mlp]
      lr: 0.0001
    - name: top_backbone
      prefixes: [encoder.layers.2, encoder.layers.3]
      lr: 0.00001
  loss_weights:
    protein_bce_class_normalized: true
    protein_bce_alpha_pos: 0.5
    protein_bce_alpha_neg: 0.5
    llps: 0.0
    teacher_llps: 0.0
    self_llps: 0.0
    nnpu: 0.0
    region_mil: 0.0
    region_gold: 0.0
    teacher_dpr: 0.0
    teacher_distill: 0.0
    self_dpr: 0.0
    negative_regularization: 0.0
    region: 0.0
    coverage: 0.0
    key: 0.0
    smoothness: 0.0
    region_teacher: 0.0
    region_key_teacher: 0.0
    region_boundary: 0.0
    region_contrastive: 0.0
    ranking_loss_enabled: true
    ranking_loss_weight: 0.2
    ranking_loss_margin: 0.15
    ranking_loss_topk_negatives: 8
    protein_logit_key: llps_logits
    ranking_positive_pool_names: [P1_driver, P2_client, P3_C_D]
    ranking_negative_pool_names: [N2_ND, N1_NP]
    hard_negative_focal_weight: 2.0
    hard_negative_focal_gamma: 2.0
    hard_negative_focal_pool_names: [N_hard]
    weighted_focal_bce: 1.0
    focal_gamma: 1.5
    positive_weight: 1.2
    client_weight: 1.2
    nd_weight: 1.5
    negative_weight: 1.0
    pairwise_rank_loss_weight: 0.4
    rank_loss_topk_negatives: 16
    client_nd_rank_weight: 1.5
    nd_rank_weight: 1.5
    driver_head: 0.15
    client_head: 0.2
    negtype_head: 0.03

postprocess:
  threshold: 0.52
  smooth_window: 3
  merge_gap: 4
  min_region_len: 8
  use_decoder_regions: false

runtime_guard:
  enabled: true
  strict: true
