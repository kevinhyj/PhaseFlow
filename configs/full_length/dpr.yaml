# Full-length DPR training configuration.
# Download data and pretrained checkpoints from Hugging Face into artifacts/.

paths:
  v2_data_root: artifacts/data/full_length/dpr/base
  packed_root: artifacts/data/full_length/dpr/packed
  tier_manifest: artifacts/data/full_length/dpr/training/protein_tiers.parquet
  official_phasepro_root: artifacts/data/full_length/dpr/evaluation/phasepro
  output_root: runs/dpr
  phaseflow_llps_checkpoint: artifacts/models/full_length/llps/model.pt
  phaseflow_checkpoint: artifacts/models/peptide/model.pt

run:
  seed: 202606188
  precision: bf16
  world_size: 8
  per_rank_batch_proteins: 1
  num_workers: 0
  prefetch_factor: 2
  log_every: 5

model:
  esm2_dim: 1280
  biophys_dim: 112
  phaseflow_llps_hidden_dim: 256
  phaseflow_hidden_dim: 256
  phaseflow_shape: 4x4
  phaseflow_bridge_tokens: 32
  phaseflow_bridge_adapter_layers: 2
  phaseflow_bridge_gate_init: 0.075
  num_heads: 8
  adapter_dim: 256
  dropout: 0.1
  window_sizes: [33, 129, 257]
  topk_fraction: 0.05
  leaky_relu_slope: 0.1
  head_type: big
  use_base_streams: true
  use_phaseflow_llps_stream: true
  use_phaseflow_stream: true

loss:
  objective: rank_p257
  bag: 1.0
  topk: 0.25
  s_bce: 0.35
  s_dice: 0.06
  s_rank: 0.75
  w_bce: 0.0
  w_rank: 0.0
  m_peak: 0.35
  boundary_radius: 17
  topk_fraction: 0.05

optimizer:
  type: AdamW
  lr: 0.000005
  weight_decay: 0.0001
  gradient_clip_norm: 1.0

scheduler:
  total_updates: 50
  warmup_updates: 0
  min_lr_ratio: 0.3

ema:
  decay: 0.997

checkpoint:
  save_updates: [25, 50]

arms:
  dpr: {}
